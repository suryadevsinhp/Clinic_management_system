<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQ Spectrum Analyzer</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- LightningChart JS -->
    <script src="https://cdn.jsdelivr.net/npm/@lightningchart/lcjs@5.2.0/dist/lightningchart.standalone.js"></script>
    
    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-soundwave"></i>
                IQ Spectrum Analyzer
            </a>
            <div class="navbar-nav ms-auto">
                <span class="nav-link">
                    <i class="bi bi-circle-fill text-success" id="connection-status"></i>
                    <span id="status-text">Connected</span>
                </span>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        <div class="row">
            <!-- Control Panel -->
            <div class="col-md-3">
                <div class="card h-100">
                    <div class="card-header">
                        <h5><i class="bi bi-sliders"></i> Control Panel</h5>
                    </div>
                    <div class="card-body">
                        <!-- File Upload Section -->
                        <div class="mb-4">
                            <h6>File Upload</h6>
                            <form id="upload-form" enctype="multipart/form-data">
                                <div class="mb-3">
                                    <label for="file-input" class="form-label">IQ File</label>
                                    <input class="form-control" type="file" id="file-input" name="file" accept=".iq,.dat,.bin,.raw,.cfile,.cu8,.cs8,.cu16,.cs16,.cf32,.cf64">
                                </div>
                                
                                <div class="mb-3">
                                    <label for="sample-rate" class="form-label">Sample Rate (Hz)</label>
                                    <input type="number" class="form-control" id="sample-rate" name="sample_rate" value="2048000">
                                </div>
                                
                                <div class="mb-3">
                                    <label for="data-type" class="form-label">Data Type</label>
                                    <select class="form-select" id="data-type" name="data_type">
                                        <option value="auto">Auto Detect</option>
                                        <option value="complex64">Complex64</option>
                                        <option value="complex128">Complex128</option>
                                        <option value="float32">Float32</option>
                                        <option value="int16">Int16</option>
                                        <option value="int8">Int8</option>
                                        <option value="uint8">UInt8</option>
                                        <option value="uint16">UInt16</option>
                                    </select>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="center-freq" class="form-label">Center Frequency (Hz)</label>
                                    <input type="number" class="form-control" id="center-freq" name="center_freq" value="0">
                                </div>
                                
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="bi bi-upload"></i> Upload & Analyze
                                </button>
                            </form>
                        </div>

                        <!-- Signal Information -->
                        <div class="mb-4" id="signal-info" style="display: none;">
                            <h6>Signal Information</h6>
                            <div class="card bg-light">
                                <div class="card-body p-2">
                                    <small id="signal-details"></small>
                                </div>
                            </div>
                        </div>

                        <!-- Demodulation Controls -->
                        <div class="mb-4" id="demod-controls" style="display: none;">
                            <h6>Demodulation</h6>
                            <div class="mb-3">
                                <label for="demod-type" class="form-label">Type</label>
                                <select class="form-select" id="demod-type">
                                    <option value="fm">FM</option>
                                    <option value="am">AM</option>
                                    <option value="usb">USB</option>
                                    <option value="lsb">LSB</option>
                                    <option value="wfm">Wideband FM</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="center-freq-offset" class="form-label">Center Freq Offset (Hz)</label>
                                <input type="number" class="form-control" id="center-freq-offset" value="0">
                            </div>
                            
                            <div class="mb-3">
                                <label for="bandwidth" class="form-label">Bandwidth (Hz)</label>
                                <input type="number" class="form-control" id="bandwidth" placeholder="Auto">
                            </div>
                            
                            <button type="button" class="btn btn-success w-100" id="demodulate-btn">
                                <i class="bi bi-play-circle"></i> Demodulate
                            </button>
                        </div>

                        <!-- Display Controls -->
                        <div class="mb-4">
                            <h6>Display Settings</h6>
                            <div class="mb-3">
                                <label for="fft-size" class="form-label">FFT Size</label>
                                <select class="form-select" id="fft-size">
                                    <option value="256">256</option>
                                    <option value="512">512</option>
                                    <option value="1024" selected>1024</option>
                                    <option value="2048">2048</option>
                                    <option value="4096">4096</option>
                                </select>
                            </div>
                            
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="" id="real-time-update">
                                <label class="form-check-label" for="real-time-update">
                                    Real-time Updates
                                </label>
                            </div>
                        </div>

                        <!-- Session History -->
                        <div class="mb-4">
                            <h6>Recent Sessions</h6>
                            <div id="session-history">
                                <p class="text-muted small">No sessions yet</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Display Area -->
            <div class="col-md-9">
                <div class="row">
                    <!-- Spectrum Display -->
                    <div class="col-md-6 mb-3">
                        <div class="card">
                            <div class="card-header">
                                <h6><i class="bi bi-graph-up"></i> Spectrum</h6>
                            </div>
                            <div class="card-body p-2">
                                <div id="spectrum-chart" style="height: 350px;"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Waterfall Display -->
                    <div class="col-md-6 mb-3">
                        <div class="card">
                            <div class="card-header">
                                <h6><i class="bi bi-water"></i> Waterfall</h6>
                            </div>
                            <div class="card-body p-2">
                                <div id="waterfall-chart" style="height: 350px;"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <!-- Constellation Diagram -->
                    <div class="col-md-6 mb-3">
                        <div class="card">
                            <div class="card-header">
                                <h6><i class="bi bi-diagram-3"></i> Constellation</h6>
                            </div>
                            <div class="card-body p-2">
                                <div id="constellation-chart" style="height: 300px;"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Time Domain -->
                    <div class="col-md-6 mb-3">
                        <div class="card">
                            <div class="card-header">
                                <h6><i class="bi bi-activity"></i> Time Domain</h6>
                            </div>
                            <div class="card-body p-2">
                                <div id="time-chart" style="height: 300px;"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Audio Player -->
                <div class="row" id="audio-player-row" style="display: none;">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">
                                <h6><i class="bi bi-volume-up"></i> Demodulated Audio</h6>
                            </div>
                            <div class="card-body">
                                <audio controls class="w-100" id="audio-player">
                                    Your browser does not support the audio element.
                                </audio>
                                <div class="mt-2">
                                    <a href="#" class="btn btn-sm btn-outline-primary" id="download-audio" download>
                                        <i class="bi bi-download"></i> Download Audio
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Progress Modal -->
    <div class="modal fade" id="progress-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Processing...</h5>
                </div>
                <div class="modal-body">
                    <div class="progress">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" 
                             role="progressbar" style="width: 100%"></div>
                    </div>
                    <p class="mt-2 mb-0" id="progress-text">Uploading and analyzing file...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Alert Container -->
    <div id="alert-container" class="position-fixed top-0 end-0 p-3" style="z-index: 1050;"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="{{ url_for('static', filename='js/chart-manager.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
