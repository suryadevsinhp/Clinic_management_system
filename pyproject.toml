[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iq-signal-decoder"
version = "1.0.0"
description = "Comprehensive IQ signal decoder for analog and digital demodulation"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "IQ Signal Decoder", email = "decoder@example.com"},
]
keywords = ["iq", "sdr", "signal-processing", "demodulation", "radio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Communications :: Ham Radio",
]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.3.0",
    "soundfile>=0.10.0",
    "click>=8.0.0",
    "rich>=12.0.0",
    "pyaudio>=0.2.11",
    "bitarray>=2.0.0",
    "crcmod>=1.7",
]

[project.optional-dependencies]
gnuradio = ["gnuradio>=3.10.0"]
dev = [
    "pytest>=6.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.910",
]

[project.scripts]
iq-decode = "iq_decoder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["iq_decoder*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true